name: CI

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements-dev.txt

      - name: 检查公开发布边界
        run: python3 scripts/closeout/verify_public_release_boundary.py

      - name: 运行 pytest
        run: pytest -v
